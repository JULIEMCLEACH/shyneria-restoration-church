backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Website Pages"
    files:
      - label: "Home Page"
        name: "home"
        file: "content/home.json"
        format: "json"
        fields:
          - { label: "Our Story", name: "our-story", widget: "text" }
          - { label: "Our Mission", name: "our-mission", widget: "text" }
          - { label: "Library Introduction", name: "library", widget: "text" }
          - { label: "Contact Us", name: "contact-us", widget: "text" }
